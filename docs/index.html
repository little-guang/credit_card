<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="以 Logistic Regression、Decision Tree 與 XGBoost 比較信用卡違約風險預測模型。">
  <title>信用卡違約風險｜模型比較報告</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #14243a;
      --muted: #61738a;
      --line: #e1e8f0;
      --paper: #ffffff;
      --canvas: #f3f7fb;
      --blue: #2864dc;
      --teal: #0d9488;
      --orange: #e98a35;
      --shadow: 0 18px 48px rgb(28 50 82 / 8%);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: Inter, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.65;
    }
    a { color: var(--blue); }
    .hero {
      padding: 62px max(24px, calc((100% - 1120px) / 2)) 54px;
      background:
        radial-gradient(ellipse at 82% 12%, rgb(72 137 236 / 26%), transparent 34%),
        linear-gradient(125deg, #10233c, #173a62 72%, #205377);
      color: white;
    }
    .eyebrow {
      color: #9ed8ee;
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 780px;
      margin: 12px 0;
      font-size: clamp(2.1rem, 5vw, 3.7rem);
      line-height: 1.16;
    }
    .hero p { max-width: 700px; margin: 12px 0 0; color: #d3e1ef; }
    .hero-links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .hero-links a {
      display: inline-block;
      padding: 9px 15px;
      border: 1px solid rgb(255 255 255 / 30%);
      border-radius: 999px;
      color: white;
      font-size: .9rem;
      text-decoration: none;
    }
    main { width: min(1120px, calc(100% - 40px)); margin: 32px auto 64px; }
    .stats, .cards, .charts, .figure-grid { display: grid; gap: 16px; }
    .stats { grid-template-columns: repeat(3, 1fr); margin-bottom: 24px; }
    .cards { grid-template-columns: repeat(3, 1fr); margin: 18px 0 30px; }
    .charts { grid-template-columns: 1fr 1fr; margin: 18px 0 30px; }
    .figure-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 18px; }
    .panel, .stat, .model-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }
    .stat { padding: 18px 20px; }
    .stat span { display: block; color: var(--muted); font-size: .88rem; }
    .stat strong { display: block; margin-top: 3px; font-size: 1.65rem; }
    .panel { padding: 24px; }
    .panel h2 { margin: 0 0 6px; font-size: 1.18rem; }
    .sub { margin: 0; color: var(--muted); font-size: .9rem; }
    .figure-card { min-width: 0; margin: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: white; }
    .figure-card a { display: block; color: inherit; }
    .figure-card img { display: block; width: 100%; height: auto; }
    .figure-card figcaption { padding: 11px 14px; border-top: 1px solid var(--line); font-size: .88rem; font-weight: 700; }
    .model-card { position: relative; padding: 20px; overflow: hidden; }
    .model-card::after {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 4px;
      background: var(--accent, var(--blue));
      content: "";
    }
    .rank { color: var(--muted); font-size: .82rem; font-weight: 750; }
    .model-card h3 { margin: 4px 0 12px; font-size: 1.05rem; }
    .score { font-size: 2rem; font-weight: 850; letter-spacing: -.04em; }
    .score-label { color: var(--muted); font-size: .82rem; }
    .mini-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .mini-metrics span { display: block; color: var(--muted); font-size: .76rem; }
    .mini-metrics strong { font-size: .96rem; }
    .explain-grid, .model-explain-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 18px; }
    .info-box { padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: #f8fbff; }
    .info-box h3 { margin: 0 0 8px; font-size: 1rem; }
    .info-box p { margin: 0; color: #405469; font-size: .9rem; }
    .analysis-controls { display: flex; flex-wrap: wrap; gap: 14px; margin: 18px 0; }
    .analysis-controls label { display: grid; gap: 5px; color: var(--muted); font-size: .84rem; font-weight: 700; }
    .analysis-controls select { min-width: 180px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; color: var(--ink); background: white; font: inherit; }
    .analysis-chart { overflow-x: auto; }
    .analysis-chart svg { display: block; width: 100%; min-width: 580px; height: auto; }
    .analysis-table { width: 100%; border-collapse: collapse; white-space: nowrap; font-size: .84rem; }
    .analysis-table-wrap { overflow-x: auto; margin-top: 16px; }
    .analysis-table th, .analysis-table td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: right; }
    .analysis-table th:first-child, .analysis-table td:first-child { text-align: left; }
    .correlation-table { table-layout: fixed; white-space: normal; font-size: .78rem; }
    .correlation-table th:first-child, .correlation-table td:first-child { width: 68%; overflow-wrap: anywhere; }
    .correlation-table th:last-child, .correlation-table td:last-child { width: 32%; white-space: nowrap; }
    .correlation-table th, .correlation-table td { padding: 9px 3px; }
    .correlation-sample { display: block; color: var(--muted); font-size: .76rem; font-weight: 400; }
    .insight-list { display: grid; gap: 8px; margin: 14px 0 0; padding-left: 20px; color: #405469; font-size: .9rem; }
    .chart-row { display: grid; grid-template-columns: 110px 1fr 48px; align-items: center; gap: 10px; margin: 16px 0; font-size: .84rem; }
    .track { height: 10px; overflow: hidden; border-radius: 999px; background: #edf2f8; }
    .bar { height: 100%; min-width: 2px; border-radius: inherit; background: var(--blue); }
    .chart-row b { text-align: right; font-variant-numeric: tabular-nums; }
    .table-wrap { overflow-x: auto; margin-top: 16px; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; font-size: .88rem; }
    th, td { padding: 12px 10px; border-bottom: 1px solid var(--line); text-align: right; }
    th { color: var(--muted); font-size: .78rem; }
    th:first-child, td:first-child { text-align: left; }
    tbody tr:last-child td { border-bottom: 0; }
    .note { margin-top: 18px; padding: 15px 17px; border-radius: 12px; background: #f1f6fc; color: #445a72; font-size: .87rem; }
    .error { padding: 18px; border: 1px solid #efc9bd; border-radius: 12px; background: #fff5f1; color: #893f2c; }
    footer { padding: 24px; color: var(--muted); text-align: center; font-size: .84rem; }
    @media (max-width: 760px) {
      .hero { padding-top: 44px; }
      .stats, .cards, .charts, .figure-grid { grid-template-columns: 1fr; }
      .chart-row { grid-template-columns: 92px 1fr 44px; gap: 8px; }
      .panel { padding: 19px; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="eyebrow">Credit Risk · Model Evaluation</div>
    <h1>信用卡違約風險<br>模型比較報告</h1>
    <p>比較 Logistic Regression、Decision Tree 與 XGBoost 對「下個月是否違約」的預測表現。透過分層交叉驗證與獨立測試集，呈現模型效能與取捨。</p>
    <nav class="hero-links" aria-label="報告導覽">
      <a href="#ranking">模型排名</a>
      <a href="#metrics">指標比較</a>
      <a href="#risk-signals">違約訊號</a>
      <a href="#segments">族群分析</a>
      <a href="#charts">結果圖表</a>
      <a href="https://archive.ics.uci.edu/dataset/350/default+of+credit+card+clients" target="_blank" rel="noreferrer">UCI 資料來源 ↗</a>
      <a href="https://github.com/little-guang/credit_card" target="_blank" rel="noopener noreferrer">GitHub 專案 ↗</a>
    </nav>
  </header>

  <main id="report" aria-live="polite">
    <p>正在讀取本次模型結果…</p>
  </main>
  <footer>此頁面為研究與教學用途，不構成個人信用或授信建議。<br><a href="https://github.com/little-guang/credit_card" target="_blank" rel="noopener noreferrer">前往 GitHub 專案</a></footer>

  <script>
    const format = (value, digits = 4) => Number(value).toFixed(digits);
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (character) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[character]);
    const colors = ["#2864dc", "#0d9488", "#e98a35"];
    const metricChart = (models, key, title, description) => `
      <section class="panel">
        <h2>${title}</h2><p class="sub">${description}</p>
        ${models.map((model, index) => `
          <div class="chart-row">
            <span>${escapeHtml(model.Model)}</span>
            <div class="track" role="img" aria-label="${escapeHtml(model.Model)} ${title}: ${format(model[key])}">
              <div class="bar" style="width:${Math.max(0, Math.min(100, Number(model[key]) * 100))}%;background:${colors[index % colors.length]}"></div>
            </div>
            <b>${format(model[key])}</b>
          </div>`).join("")}
      </section>`;
    const figureCard = (chart) => `
      <figure class="figure-card">
        <a href="${escapeHtml(chart.src)}" target="_blank" rel="noreferrer">
          <img src="${escapeHtml(chart.src)}" alt="${escapeHtml(chart.title)}" loading="lazy">
        </a>
        <figcaption>${escapeHtml(chart.title)}</figcaption>
      </figure>`;

    let segmentReport = null;
    let segmentError = null;
    const segmentNumber = (value, digits = 0) => value == null
      ? "—"
      : Number(value).toLocaleString("zh-TW", { maximumFractionDigits: digits, minimumFractionDigits: digits });
    const renderSegmentAnalysis = () => {
      const container = document.querySelector("#segment-analysis-content");
      const riskContainer = document.querySelector("#risk-signals");
      if (!container || !riskContainer) return;
      if (segmentError) {
        container.innerHTML = `<div class="error">無法載入族群分析資料：${escapeHtml(segmentError)}。請執行 <code>uv run python analyze_segments.py</code>。</div>`;
        riskContainer.querySelector("#risk-factor-tables").innerHTML =
          `<div class="error">無法載入行為風險分析資料：${escapeHtml(segmentError)}。請執行 <code>uv run python analyze_segments.py</code>。</div>`;
        riskContainer.querySelector("#correlation-rows").innerHTML = "";
        return;
      }
      if (!segmentReport) return;

      const dimensionSelect = container.querySelector("#segment-dimension");
      const measureSelect = container.querySelector("#segment-measure");
      const formatRate = (value) => `${segmentNumber(value, 1)}%`;
      const rateInterval = (item) =>
        `${formatRate(item.default_rate)} (${formatRate(item.default_rate_ci_low)}–${formatRate(item.default_rate_ci_high)})`;
      const riskFactors = segmentReport.risk_factors || [];
      const delayFactor = riskFactors.find((item) => item.id === "delay_frequency");
      const latestFactor = riskFactors.find((item) => item.id === "latest_delay");
      const utilizationFactor = riskFactors.find((item) => item.id === "credit_utilization");
      const coverageFactor = riskFactors.find((item) => item.id === "payment_coverage");
      const delayNone = delayFactor?.groups.find((item) => item.group === "0 次");
      const delayFrequent = delayFactor?.groups.find((item) => item.group === "3 次以上");
      const recentNoDelay = latestFactor?.groups.find((item) => item.group === "無正值延遲紀錄");
      const recentTwoMonths = latestFactor?.groups.find((item) => item.group === "2 個月");
      const utilizationLow = utilizationFactor?.groups.find((item) => item.group === "低於 30%");
      const utilizationMidHigh = utilizationFactor?.groups.find((item) => item.group === "60%–89%");
      const coverageLow = coverageFactor?.groups.find((item) => item.group === "低於 25%");
      const coverageFull = coverageFactor?.groups.find((item) => item.group === "100% 以上");
      const riskInsights = [];
      if (delayNone && delayFrequent) {
        riskInsights.push(
          `最明顯的行為訊號是重複延遲：近六期有 3 次以上正值延遲者違約率 ${rateInterval(delayFrequent)}（n=${segmentNumber(delayFrequent.count)}），0 次者為 ${rateInterval(delayNone)}（n=${segmentNumber(delayNone.count)}）；相差 ${segmentNumber(delayFrequent.difference_vs_reference_pp, 1)} 個百分點，約為 ${segmentNumber(delayFrequent.relative_rate_vs_reference, 1)} 倍。`
        );
      }
      if (recentNoDelay && recentTwoMonths) {
        riskInsights.push(
          `最近一期 PAY_0 = 2 的群組違約率為 ${rateInterval(recentTwoMonths)}，PAY_0 非正值群組為 ${rateInterval(recentNoDelay)}；近期狀態提供額外警訊，但小樣本群組的區間較寬。`
        );
      }
      if (utilizationLow && utilizationMidHigh) {
        riskInsights.push(
          `額度使用率不是單調關係：60%–89% 組為 ${rateInterval(utilizationMidHigh)}，低於 30% 組為 ${rateInterval(utilizationLow)}；因此不宜把高使用率單獨當作違約原因或唯一門檻。`
        );
      }
      if (coverageLow && coverageFull) {
        riskInsights.push(
          `六期還款總額低於帳單總額 25% 的群組為 ${rateInterval(coverageLow)}，還款總額達帳單總額的群組為 ${rateInterval(coverageFull)}；此為跨月彙總代理指標，不能直接解讀為客戶未繳金額。`
        );
      }
      riskContainer.querySelector("#risk-insights").innerHTML = riskInsights
        .map((insight) => `<li>${escapeHtml(insight)}</li>`)
        .join("");
      riskContainer.querySelector("#risk-factor-tables").innerHTML = riskFactors.map((factor) => `
        <div class="analysis-table-wrap">
          <h3>${escapeHtml(factor.title)}</h3>
          <p class="sub">${escapeHtml(factor.description)} 參照組：${escapeHtml(factor.reference_group)}；有效樣本 n=${segmentNumber(factor.eligible_count)}。</p>
          <table class="analysis-table">
            <thead><tr><th>分組</th><th>樣本數</th><th>違約人數</th><th>違約率（95% CI）</th><th>相對參照組違約比例</th></tr></thead>
            <tbody>${factor.groups.map((item) => `
              <tr>
                <td>${escapeHtml(item.group)}</td>
                <td>${segmentNumber(item.count)}</td>
                <td>${segmentNumber(item.default_count)}</td>
                <td>${rateInterval(item)}</td>
                <td>${item.relative_rate_vs_reference == null ? "—" : `${segmentNumber(item.relative_rate_vs_reference, 2)} 倍`}</td>
              </tr>`).join("")}
            </tbody>
          </table>
        </div>`).join("");
      const draw = () => {
        const dimension = dimensionSelect.value;
        const measure = measureSelect.value;
        const order = {
          age_group: ["21–29歲", "30–39歲", "40–49歲", "50–59歲", "60歲以上"],
          sex: ["女性", "男性"],
          education: ["研究所", "大學", "高中", "其他", "未分類"],
          marriage: ["已婚", "未婚", "其他", "未分類"]
        };
        const groups = segmentReport.groups
          .filter((item) => item.dimension === dimension)
          .sort((left, right) => order[dimension].indexOf(left.group) - order[dimension].indexOf(right.group));
        const maxValue = Math.max(1, ...groups.map((item) => Number(item[measure] || 0)));
        const chartHeight = Math.max(150, groups.length * 42 + 28);
        const chartRows = groups.map((item, index) => {
          const y = index * 42 + 12;
          const value = Number(item[measure] || 0);
          const barWidth = Math.max(2, value / maxValue * 500);
          return `
            <g>
              <text x="12" y="${y + 19}" fill="#405469" font-size="13">${escapeHtml(item.group)}</text>
              <rect x="170" y="${y}" width="${barWidth}" height="26" rx="6" fill="${colors[index % colors.length]}">
                <title>${escapeHtml(item.group)}：${segmentNumber(value, measure === "default_rate" ? 1 : 0)}</title>
              </rect>
              <text x="${Math.min(805, 180 + barWidth)}" y="${y + 19}" fill="#14243a" font-size="12">${segmentNumber(value, measure === "default_rate" ? 1 : 0)}${measure === "default_rate" ? "%" : ""}</text>
            </g>`;
        }).join("");
        container.querySelector("#segment-chart-title").textContent =
          `${segmentReport.dimensions[dimension]}：${segmentReport.measures[measure]}`;
        container.querySelector("#segment-chart").innerHTML =
          `<svg class="segment-svg" viewBox="0 0 880 ${chartHeight}" role="img" aria-label="${escapeHtml(segmentReport.dimensions[dimension])}分組${escapeHtml(segmentReport.measures[measure])}長條圖">${chartRows}</svg>`;
        container.querySelector("#segment-table").innerHTML = groups.map((item) => `
          <tr>
            <td>${escapeHtml(item.group)}</td>
            <td>${segmentNumber(item.count)}</td>
            <td>${segmentNumber(item.default_count)}</td>
            <td>${segmentNumber(item[measure], measure === "default_rate" ? 1 : 0)}${measure === "default_rate" ? "%" : ""}</td>
            <td>${rateInterval(item)}</td>
            <td>${segmentNumber(item.median_credit_limit)}</td>
            <td>${segmentNumber(item.median_avg_bill)}</td>
            <td>${segmentNumber(item.median_avg_payment)}</td>
          </tr>`).join("");
      };
      if (!container.dataset.bound) {
        dimensionSelect.addEventListener("change", draw);
        measureSelect.addEventListener("change", draw);
        container.dataset.bound = "true";
      }
      draw();

      const byDimension = (dimension) => segmentReport.groups.filter((item) => item.dimension === dimension);
      const ages = byDimension("age_group");
      const sexes = byDimension("sex");
      const educations = byDimension("education");
      const ageMin = ages.reduce((a, b) => a.default_rate < b.default_rate ? a : b);
      const ageMax = ages.reduce((a, b) => a.default_rate > b.default_rate ? a : b);
      const male = sexes.find((item) => item.group === "男性");
      const female = sexes.find((item) => item.group === "女性");
      const graduate = educations.find((item) => item.group === "研究所");
      const highSchool = educations.find((item) => item.group === "高中");
      const displayRate = (item) => `${item.group} ${rateInterval(item)}（n=${segmentNumber(item.count)}）`;
      container.querySelector("#segment-insights").innerHTML = `
        <li>年齡組違約率從 ${displayRate(ageMin)} 到 ${displayRate(ageMax)}；最高率組樣本相對較少，需連同區間解讀，不能視為年齡造成違約。</li>
        <li>男性為 ${displayRate(male)}，女性為 ${displayRate(female)}；此為未調整的人口分組差異，不代表性別本身具有因果影響。</li>
        <li>高中組為 ${displayRate(highSchool)}，研究所組為 ${displayRate(graduate)}；教育分組只能描述此樣本，且不是比還款行為更直接的風險證據。</li>`;

      riskContainer.querySelector("#correlation-rows").innerHTML = segmentReport.correlations.map((item) => `
        <tr><td>${escapeHtml(item.feature)}<span class="correlation-sample">樣本數 ${segmentNumber(item.count)}</span></td><td>${segmentNumber(item.rho, 3)}</td></tr>
      `).join("");
    };
    fetch("./segment-analysis.json")
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then((analysis) => {
        segmentReport = analysis;
        renderSegmentAnalysis();
      })
      .catch((error) => {
        segmentError = error.message;
        renderSegmentAnalysis();
      });

    fetch("./model-comparison.json")
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then((report) => {
        const models = report.models;
        if (!Array.isArray(models) || models.length !== 3) {
          throw new Error("模型比較資料不完整，請重新執行 run_all_models.py。");
        }
        if (!report.charts || !Array.isArray(report.charts.comparison) || !Array.isArray(report.charts.models)) {
          throw new Error("圖表清單不完整，請重新執行 run_all_models.py。");
        }
        const cards = models.map((model, index) => `
          <article class="model-card" style="--accent:${colors[index % colors.length]}">
            <div class="rank">第 ${Number(model.Overall_Rank)} 名</div>
            <h3>${escapeHtml(model.Model)}</h3>
            <div class="score">${format(model.Overall_Score)}</div>
            <div class="score-label">綜合分數</div>
            <div class="mini-metrics">
              <div><span>測試 PR-AUC</span><strong>${format(model.Test_PR_AUC)}</strong></div>
              <div><span>測試 Recall</span><strong>${format(model.Test_Recall)}</strong></div>
              <div><span>測試 ROC-AUC</span><strong>${format(model.Test_ROC_AUC)}</strong></div>
              <div><span>測試 F1</span><strong>${format(model.Test_F1)}</strong></div>
            </div>
          </article>`).join("");
        const rows = models.map((model) => `
          <tr>
            <td>${escapeHtml(model.Model)}</td>
            <td>${format(model.CV_PR_AUC)}</td><td>${format(model.Test_PR_AUC)}</td>
            <td>${format(model.CV_ROC_AUC)}</td><td>${format(model.Test_ROC_AUC)}</td>
            <td>${format(model.Test_Precision)}</td><td>${format(model.Test_Recall)}</td>
            <td>${format(model.Test_F1)}</td>
            <td>${format(model.Overall_Score)}</td><td>${Number(model.Overall_Rank)}</td>
          </tr>`).join("");
        const rate = Number(report.dataset.default_rate);

        document.querySelector("#report").innerHTML = `
          <section class="stats" aria-label="資料概況">
            <div class="stat"><span>資料筆數</span><strong>${Number(report.dataset.rows).toLocaleString("zh-TW")}</strong></div>
            <div class="stat"><span>違約筆數</span><strong>${Number(report.dataset.default_count).toLocaleString("zh-TW")}</strong></div>
            <div class="stat"><span>違約比例</span><strong>${format(rate * 100, 1)}%</strong></div>
          </section>

          <section class="panel" style="margin-bottom:18px">
            <h2>資料來源與使用說明</h2>
            <p class="sub">本報告使用 UCI Machine Learning Repository 的 Default of Credit Card Clients 資料集，資料來源請一併標示如下：<a href="https://archive.ics.uci.edu/dataset/350/default+of+credit+card+clients" target="_blank" rel="noreferrer">UCI Machine Learning Repository — Default of Credit Card Clients</a>。</p>
            <div class="note">
              引用建議：Yeh, I.-C., &amp; Lien, C.-H. (2009). <em>The comparisons of data mining techniques for the predictive accuracy of probability of default of credit card clients</em>. Expert Systems with Applications.<br>
              本分析僅供研究與教學用途，不構成個人信用評分、授信建議或商業決策；結果不能直接推論未來授信成效，仍需依實際規則、成本與公平性檢查進行驗證。
            </div>
          </section>

          <section class="panel" style="margin-bottom:18px">
            <h2>資料意義與指標解讀</h2>
            <p class="sub">這份資料大約有 30,000 筆，違約的人大約是 ${format(rate * 100, 1)}%。也就是說，約 1/5 的人下一個月會違約。因為違約的人比較少，單看「準不準」不夠，還要看模型能不能真的抓出高風險客戶，所以這裡特別看 Precision、Recall、PR-AUC 與 F1。</p>
            <div class="explain-grid">
              <div class="info-box">
                <h3>PR-AUC</h3>
                <p>這個值看的是：模型抓到違約客戶的能力有多強。它很適合用在「違約人數少」的情況，數字越高，代表模型不容易漏抓真正有風險的人。</p>
              </div>
              <div class="info-box">
                <h3>ROC-AUC</h3>
                <p>這個值看的是：模型能不能把「會違約」和「不會違約」分開。數字大約在 0.5 到 1 之間，越接近 1 就表示區分能力越好。</p>
              </div>
              <div class="info-box">
                <h3>Precision</h3>
                <p>意思是：模型判定為「違約」時，真的違約的比例。高 Precision 表示它不會太容易誤判正常客戶。</p>
              </div>
              <div class="info-box">
                <h3>Recall</h3>
                <p>意思是：真的違約的人中，有多少被模型抓出來。對風險預測來說，這很重要，因為最怕漏掉高風險客戶。</p>
              </div>
              <div class="info-box">
                <h3>F1</h3>
                <p>這是 Precision 和 Recall 的綜合分數。它像是把「不誤判」和「不漏抓」兩個重點一起衡量，特別適合不平衡資料。</p>
              </div>
              <div class="info-box">
                <h3>綜合分數</h3>
                <p>這裡用的是：Test PR-AUC × 0.35 + Test Recall × 0.25 + Test F1 × 0.20 + Test ROC-AUC × 0.20。簡單說，就是看模型是不是既能抓出高風險客戶，又能整體分辨得比較清楚。</p>
              </div>
            </div>
          </section>

          <section class="panel" style="margin-bottom:18px">
            <h2>預測內容與資料切分</h2>
            <div class="model-explain-grid">
              <div class="info-box">
                <h3>預測目標</h3>
                <p>這個專案要預測的是：客戶在下一個月會不會違約。也就是欄位 <code>default_payment_next_month</code>：0 表示沒違約，1 表示違約。模型會根據過去的信用額度、還款狀態、帳單金額、年齡和婚姻狀況等資料，猜測這個人是否屬於高風險群。</p>
              </div>
              <div class="info-box">
                <h3>資料切分方式</h3>
                <p>我們先把資料分成 80% 訓練、20% 測試，並且使用 <code>stratify=y</code> 保持違約與未違約比例大致相同。接著在訓練資料裡再做 5 折交叉驗證，這樣能更可靠地比較模型，不會因為某一次切分剛好偏差而誤判好壞。</p>
              </div>
            </div>
          </section>

          <section class="panel" style="margin-bottom:18px">
            <h2>三個模型的特性與意義</h2>
            <div class="model-explain-grid">
              <div class="info-box">
                <h3>Logistic Regression</h3>
                <p>它很像是做「加權判斷」。它會看每個特徵對違約機率有多大影響，適合當基準模型。好處是容易理解，缺點是如果資料關係比較複雜，它可能做得不如更強的模型。</p>
              </div>
              <div class="info-box">
                <h3>Decision Tree</h3>
                <p>它會像一棵判斷樹一樣，一步一步把資料切開。它比較能抓到非線性規則，也方便看哪些特徵最重要。不過如果樹太深，可能會過度擬合，表現可能在新資料上變差。</p>
              </div>
              <div class="info-box">
                <h3>XGBoost</h3>
                <p>它是很多樹一起合作的模型，通常很擅長處理複雜資料，表現常常比較強。它很適合這種有很多特徵、關係不簡單的風險預測問題，但模型比較複雜，調參數也比較重要。</p>
              </div>
              <div class="info-box">
                <h3>數據代表的意義</h3>
                <p>這些數字表示的是：在過去資料上，哪個模型比較會辨識出高風險客戶。只要 Recall 和 PR-AUC 比較高，代表它比較能抓到真正會違約的人；如果 ROC-AUC 和 F1 也高，就表示整體表現比較穩定。這些結果不是未來保證，而是一個歷史資料上的比較。</p>
              </div>
            </div>
          </section>

          <section id="risk-signals" class="panel" style="margin-bottom:18px">
            <h2>哪些訊號與下期違約較相關？</h2>
            <p class="sub">比較前六期延遲紀錄、最近一期付款狀態、帳單／信用額度，以及還款金額／帳單金額。違約率是歷史樣本中的比例，不是個人預測或因果結論。</p>
            <ul id="risk-insights" class="insight-list"></ul>
            <h3 style="margin-top:22px">與下期違約相關程度較高的特徵</h3>
            <p class="sub">依 Spearman 相關係數絕對值排序，只顯示 |ρ| ≥ 0.10 的特徵；正值代表特徵較高時違約標記通常也較高，負值代表反向排序關係。樣本很大時係數可能容易達統計顯著，因此這裡著重關聯強度與可解讀性，不代表因果或調整後效果。</p>
            <div class="analysis-table-wrap">
              <table class="analysis-table correlation-table">
                <thead><tr><th>特徵與樣本數</th><th>ρ</th></tr></thead>
                <tbody id="correlation-rows"></tbody>
              </table>
            </div>
            <div id="risk-factor-tables"></div>
            <div class="note">延遲期數定義為六期 PAY 欄位中大於 0 的期數。每組均列出樣本數及 95% Wilson 信賴區間；「相對比例」是違約率之比，不是勝算比。最近一期帳單／額度及六期還款／帳單都只是粗略代理指標，尤其還款與帳單可能有跨月時間差；不可單獨據此判斷個人是否會違約。</div>
          </section>

          <section id="segments" class="panel" style="margin-bottom:18px">
            <h2>不同族群的帳單與還款狀況</h2>
            <p class="sub">從 30,000 筆歷史資料，切換年齡、性別、學歷或婚姻狀況，比較信用額度、帳單、還款和下一期違約比例。金額以中位數呈現，較不容易被少數特別大的金額影響。</p>
            <div id="segment-analysis-content">
              <p class="sub">正在載入分組分析…</p>
              <div class="analysis-controls">
                <label>依哪個條件分組
                  <select id="segment-dimension">
                    <option value="age_group">年齡</option><option value="sex">性別</option>
                    <option value="education">學歷</option><option value="marriage">婚姻狀況</option>
                  </select>
                </label>
                <label>比較哪個數值
                  <select id="segment-measure">
                    <option value="median_credit_limit">信用額度中位數</option>
                    <option value="median_latest_bill">最近一期帳單中位數</option>
                    <option value="median_avg_bill">近六期平均帳單中位數</option>
                    <option value="median_latest_payment">最近一期還款中位數</option>
                    <option value="median_avg_payment">近六期平均還款中位數</option>
                    <option value="default_rate">下一期違約比例</option>
                  </select>
                </label>
              </div>
              <h3 id="segment-chart-title"></h3>
              <div id="segment-chart" class="analysis-chart"></div>
              <div class="analysis-table-wrap">
                <table class="analysis-table">
                  <thead><tr><th>族群</th><th>樣本數</th><th>違約人數</th><th>目前選擇的數值</th><th>違約比例（95% CI）</th><th>信用額度中位數</th><th>近六期平均帳單中位數</th><th>近六期平均還款中位數</th></tr></thead>
                  <tbody id="segment-table"></tbody>
                </table>
              </div>
              <h3 style="margin-top:22px">從這批資料觀察到的差異</h3>
              <ul id="segment-insights" class="insight-list"></ul>
              <div class="note">資料沒有逐筆消費明細或商店/品項消費金額，因此這裡分析的是每月帳單金額、還款金額和信用額度，不是實際刷卡消費明細。PAY 還款狀態中的正值代表延遲；「近六期延遲次數」是六期中 PAY 值大於 0 的期數。學歷代碼 0、5、6 及婚姻代碼 0 合併為「未分類」；未分類/其他部分組別樣本較少，結果不宜直接比較下結論。分析呈現的是同時出現的關聯，不能解讀成某種年齡、性別或學歷造成違約。</div>
            </div>
          </section>

          <section id="ranking">
            <h2>模型排名</h2>
            <p class="sub">綜合分數採測試 PR-AUC、Recall、F1 與 ROC-AUC 加權計算。</p>
            <div class="cards">${cards}</div>
          </section>

          <section id="metrics" class="charts">
            ${metricChart(models, "Test_PR_AUC", "測試 PR-AUC", "違約類別比例不均衡時，PR-AUC 有助觀察正類預測品質。")}
            ${metricChart(models, "Test_Recall", "測試 Recall", "違約客戶中被正確找出的比例；Recall 越高，漏判越少。")}
          </section>

          <section id="charts" class="panel">
            <h2>模型比較圖</h2>
            <p class="sub">這些圖表會在每次執行所有模型後自動更新。點擊圖表可另開原尺寸檢視。</p>
            <div class="figure-grid">${report.charts.comparison.map(figureCard).join("")}</div>
          </section>

          <section class="panel" style="margin-top:18px">
            <h2>資料分布探索</h2>
            <p class="sub">由 explore_data.py 產生的數值特徵分布圖。</p>
            <div class="figure-grid">
              <figure class="figure-card">
                <a href="./assets/numeric_distributions.png" target="_blank" rel="noreferrer">
                  <img src="./assets/numeric_distributions.png" alt="數值特徵分布直方圖" loading="lazy" onerror="this.closest('figure').hidden=true">
                </a>
                <figcaption>數值特徵分布</figcaption>
              </figure>
            </div>
          </section>

          ${report.charts.models.map((modelCharts) => `
            <section class="panel" style="margin-top:18px">
              <h2>${escapeHtml(modelCharts.name)} 圖表</h2>
              <p class="sub">保留測試集的分類結果、區辨曲線與特徵重要度。</p>
              <div class="figure-grid">${modelCharts.charts.map(figureCard).join("")}</div>
            </section>`).join("")}

          <section class="panel">
            <h2>完整指標</h2>
            <p class="sub">CV 為訓練資料上的 5-fold 分層交叉驗證平均；Test 為保留 20% 測試集。</p>
            <div class="table-wrap">
              <table>
                <thead><tr>
                  <th>模型</th><th>CV PR-AUC</th><th>Test PR-AUC</th>
                  <th>CV ROC-AUC</th><th>Test ROC-AUC</th>
                  <th>Precision</th><th>Recall</th><th>F1</th>
                  <th>綜合分數</th><th>排名</th>
                </tr></thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
            <div class="note">
              綜合分數 = Test PR-AUC × 0.35 + Test Recall × 0.25 + Test F1 × 0.20 + Test ROC-AUC × 0.20。
              各模型的 Gap 欄位均為「CV 平均 − Test」，僅供比較泛化差距；分數權重是本專案的分析設定，不是通用標準。
            </div>
          </section>
          <section class="panel" style="margin-top:18px">
            <h2>資料與限制</h2>
            <p class="sub">資料取自 UCI Default of Credit Card Clients。這是單一歷史資料集的隨機分層切分結果，不能直接代表未來期間或實際授信成效；正式決策仍需時間外驗證、成本敏感的閾值評估與公平性檢查。</p>
          </section>`;
        renderSegmentAnalysis();
      })
      .catch((error) => {
        document.querySelector("#report").innerHTML = `
          <div class="error">
            <strong>目前無法載入模型報告。</strong>
            <p>${escapeHtml(error.message)}</p>
            <p>在專案根目錄執行 <code>uv run python run_all_models.py</code> 產生報告資料，再重新整理此頁。</p>
          </div>`;
      });
  </script>
</body>
</html>
